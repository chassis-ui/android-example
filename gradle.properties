# The one place that says which brand this app is, and where it is built from.
#
# Change CHASSIS_BRAND here, or override it for one build:
#   ./gradlew assembleDebug -PCHASSIS_BRAND=sinefil
#
# To adopt a new release, change its version here and build. The syncBrand task downloads it,
# checks it and replaces Generated/. The same goes for any other setting of this block, so a team
# can point this app at its own tokens, assets and icons.

CHASSIS_BRAND=chassis
CHASSIS_APP=demo

# The tokens and the assets: an archive per brand, on a release v<version> of a GitHub repository
CHASSIS_TOKENS_REPOSITORY=chassis-ui/website-tokens
CHASSIS_TOKENS_VERSION=0.3.0
CHASSIS_TOKENS_ARCHIVE=website-tokens-android-{app}-{brand}-{version}.zip

CHASSIS_ASSETS_REPOSITORY=chassis-ui/website-assets
CHASSIS_ASSETS_VERSION=0.5.0
CHASSIS_ASSETS_ARCHIVE=website-assets-android-{app}-{brand}-{version}.zip

# The icons: one archive for every brand, on a release v<version> of a GitHub repository
CHASSIS_ICONS_REPOSITORY=chassis-ui/website-icons
CHASSIS_ICONS_VERSION=0.1.0
CHASSIS_ICONS_ARCHIVE=chassis-icons-android-{version}.zip

# Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
