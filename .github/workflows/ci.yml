name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        brand: [chassis, sinefil]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Cache the downloads
        uses: actions/cache@v5
        with:
          path: .cache
          key: downloads-${{ matrix.brand }}-${{ hashFiles('gradle.properties') }}

      - name: Lint
        run: scripts/lint-tokens.sh

      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./gradlew :app:assembleDebug -PCHASSIS_BRAND=${{ matrix.brand }}
